<style>
/* Layout: 224px nav rail + fluid workspace. Stock register is a ledger table with a sticky item column.
   Palette: steel-mist neutrals, harbour navy brand, one turmeric dot in the mark. Status colors are separate from series colors. */
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--surface2:#F4F6F8;--ink:#121C26;--muted:#5B6B79;--line:#D8DFE5;--line2:#E7ECF0;

  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151D;--surface:#151F2A;--surface2:#1B2734;--ink:#E7EDF2;--muted:#93A3B2;--line:#27374A;--line2:#1F2D3D;
  --brand:#8DB8E8;--brand-ink:#0B1520;--brand-soft:#1B2E45;--spice:#E5A920;
  --good:#4CC38A;--good-bg:#12301F;--warn:#E5B04A;--warn-bg:#33270F;--bad:#F0806F;--bad-bg:#3A1A17;--info:#7FB1E3;--info-bg:#152B44;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#223142;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151D;--surface:#151F2A;--surface2:#1B2734;--ink:#E7EDF2;--muted:#93A3B2;--line:#27374A;--line2:#1F2D3D;
  --brand:#8DB8E8;--brand-ink:#0B1520;--brand-soft:#1B2E45;--spice:#E5A920;
  --good:#4CC38A;--good-bg:#12301F;--warn:#E5B04A;--warn-bg:#33270F;--bad:#F0806F;--bad-bg:#3A1A17;--info:#7FB1E3;--info-bg:#152B44;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--grid:#223142;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

button,input,select,textarea{font:inherit;color:inherit}

h1,h2,h3,p{margin:0}
.dim{color:var(--muted)}small{font-size:11.5px;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;max-width:1520px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;padding-block:22px;display:flex;flex-direction:column;gap:22px}

.nav{display:flex;flex-direction:column;gap:2px}
.nv{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}

input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}

label.f input,label.f select{font-size:14px;color:var(--ink)}

.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.strip>div{padding:10px 14px;border-left:1px solid var(--line);min-width:0}.strip>div:first-child{border-left:0}
.strip b{display:block;font:500 15px var(--f-mono);margin-top:2px}

/* attention */
.att{display:flex;flex-direction:column;gap:2px}
.att button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;width:100%}

.dot.bad{background:var(--bad)}.dot.warn{background:var(--spice)}.dot.info{background:var(--info)}.dot.good{background:var(--good)}

.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.tw.tall{max-height:66vh}

th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}

.iname{font-weight:500;display:block}

.ro{font-family:var(--f-mono);color:var(--muted)}
.neg{color:var(--bad)}.pos{color:var(--good)}
td small{display:inline;margin-left:4px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
.p-ok{background:var(--good-bg);color:var(--good)}.p-watch{background:var(--warn-bg);color:var(--warn)}

.own{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.own i{width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font:600 9.5px var(--f-body);display:grid;place-items:center;font-style:normal}
.vb{display:inline-block;position:relative;width:70px;height:8px;background:var(--line2);border-radius:4px;vertical-align:middle}
.vb::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.6}
.vb i{position:absolute;top:0;bottom:0;border-radius:4px}
.sbar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--line2)}
.sbar span{display:block;height:100%}
.hbar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}.hbar i{display:block;height:100%;background:var(--s2);border-radius:4px}

.lrow{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}

.sums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}

  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:780px;padding:20px 22px;margin-block:4vh}

.dh h2{font:700 21px var(--f-display);letter-spacing:-.01em}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.dfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:16px}

.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.lcard{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}

.tp{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.tp i{width:9px;height:9px;border-radius:3px;display:inline-block}
td.wrap{white-space:normal;min-width:230px;max-width:340px}
.lv{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line2)}
.lv .lt{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.lv output{font:500 13px var(--f-mono)}
.lv input[type=range]{width:100%;accent-color:var(--brand)}
.wi-out{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-top:12px}
.wi-big{font:700 28px/1.1 var(--f-display);letter-spacing:-.01em}
.stack{display:flex;gap:2px;height:28px;border-radius:8px;overflow:hidden;background:var(--line2)}
.stack span{display:block;height:100%;min-width:3px}
.mini td,.mini th{padding:6px 8px}
.mini th:first-child,.mini td:first-child{min-width:130px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}.sums{grid-template-columns:repeat(2,minmax(0,1fr))}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.strip>div:nth-child(4){border-left:0}.strip>div:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .side{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand me" "nav nav";gap:8px 12px;padding-block:10px 8px;background:var(--bg);z-index:30;max-height:none;align-items:center}
  .brand{grid-area:brand}.me{grid-area:me;margin:0;padding:0;border:0;flex-direction:row;align-items:center}.who{display:none}
  .nav{grid-area:nav;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .main{padding-block:14px 60px}
  .h1{font-size:23px}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:0!important;border-top:1px solid var(--line)}.kpi:first-child{border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)!important}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}.sums{grid-template-columns:minmax(0,1fr)}input[type=search]{width:100%}.dlg{padding:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function expectedFor(sales,dishes,date){var m={},s=sales[date];if(!s)return m;dishes.forEach(function(d){var q=s[d.id];if(!q)return;d.recipe.forEach(function(r){m[r.item]=(m[r.item]||0)+q*r.qty})});return m}

function buildSample(){
  var rnd=mulberry32(20261017);
  var N=function(){var u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*rnd())};
  var end='2026-10-17',start=D.add(end,-29);
  var users=[{id:'u1',name:'Rajiv Malhotra',role:'owner',pin:'1111'},{id:'u2',name:'Priya Nair',role:'restro',pin:'2222'},{id:'u3',name:'Suresh Yadav',role:'store',pin:'3333'}];
  var items=ITEMS.map(function(r,i){return {id:'i'+(i+1),name:r[0],cat:r[1],unit:r[2],cost:r[3],owner:r[4],reorder:0,tol:TOL[r[1]],open:0,from:start}});
  var byName={};items.forEach(function(i){byName[i.name]=i});
  var dishes=DISHES.map(function(r,i){return {id:'d'+(i+1),name:r[0],cat:r[1],price:r[2],recipe:Object.keys(r[4]).map(function(n){return {item:byName[n].id,qty:r[4][n]}})}});
  var dates=[];for(var d=start;d<=end;d=D.add(d,1))dates.push(d);
  var sales={};
  dates.forEach(function(d){
    var wf=[1.35,.85,.85,.9,1,1.25,1.45][D.dow(d)],ev=rnd()<.1?1.12:1;sales[d]={};
    dishes.forEach(function(dh,i){sales[d][dh.id]=Math.max(0,Math.round(DISHES[i][3]*wf*ev*(1+.1*N())))});
  });
  var ex=dates.map(function(d){return expectedFor(sales,dishes,d)});
  var avg={};items.forEach(function(it){avg[it.id]=ex.reduce(function(a,m){return a+(m[it.id]||0)},0)/dates.length});
  var entries={};dates.forEach(function(d){entries[d]={}});
  var chick={},prawn={},nc=0,np=0;
  while(nc<6){var x=Math.floor(rnd()*30);if(!chick[x]){chick[x]=1;nc++}}
  while(np<11){var y=Math.floor(rnd()*30);if(!prawn[y]){prawn[y]=1;np++}}
  var MISSING={'Basmati Rice':1,'Atta':1,'Cooking Oil':1,'Sugar':1,'Maida':1};
  var LOWSET={'Butter':1,'Prawns':1,'Mango Pulp':1};
  items.forEach(function(it){
    var a=avg[it.id],pcs=it.unit==='pcs',nm=it.name;
    var cover=(it.cat==='Groceries'||it.cat==='Beverages')?8:3;
    var rq=function(v){return pcs?Math.round(v):round3(v)};
    var stock=pcs?Math.round(a*cover*.8):round2(a*cover*.8);
    it.open=stock;it.reorder=pcs?Math.ceil(a*.5):round2(a*.5);
    dates.forEach(function(d,idx){
      var e=ex[idx][it.id]||0,p=0;
      if(stock<a*cover*.55){var q=a*cover-stock;p=pcs?Math.ceil(q):Math.ceil(q*2)/2}
      var dw=D.dow(d),m=1+.012+.018*N();
      if(nm==='Paneer'&&(dw===5||dw===6||dw===0))m+=.12+.03*N();
      if(nm==='Cooking Oil')m+=.17+.04*N();
      if(nm==='Chicken'&&chick[idx])m+=.12;
      if(nm==='Prawns'&&prawn[idx])m-=.2+.04*rnd();
      if(nm==='Eggs'&&(idx===9||idx===22))m+=.11;
      if(nm==='Onion')m+=.02;
      var c=Math.min(rq(e*m),round3(stock+p));
      var w=0;
      if(it.cat==='Vegetables'&&rnd()<.4)w=e*(.01+.03*rnd());
      if(nm==='Tomato'&&(idx===6||idx===14||idx===21))w=e*.3;
      if((nm==='Milk'||nm==='Curd')&&rnd()<.2)w=e*.03;
      if(it.cat==='Non-Veg'&&rnd()<.12)w=e*.04;
      w=rq(w);w=Math.min(w,Math.max(0,round3(stock+p-c)));
      var close=round3(stock+p-c-w);
      var k=close*(1+.003*N());
      if(nm==='Cashew')k=close*(1-(.035+.02*rnd()));
      if(nm==='Cola 300ml'&&rnd()<.45)k=close-(1+Math.floor(rnd()*3));
      else if(rnd()<.04)k=close*.97;
      k=Math.max(0,pcs?Math.round(k):round2(k));
      var rec={c:c};if(p)rec.p=p;if(w)rec.w=w;
      if(!(idx===29&&MISSING[nm]))rec.k=k;
      entries[d][it.id]=rec;
      stock=rec.k==null?close:k;
    });
    if(LOWSET[nm])it.reorder=round2(Math.max(it.reorder,stock*1.3+.05));
  });
  return {meta:{name:'BEHKAAM FOODS PRIVATE LIMITED',start:start,end:end,sample:true,targetFC:30},users:users,items:items,dishes:dishes,sales:sales,entries:entries,audit:[],fixes:{}};
}

/* ---------- engine ---------- */
function statusOf(it,exp,c){
  if(!(exp>0))return c>0?'watch':'none';
  var v=(c-exp)/exp,t=it.tol/100;
  if(v>2*t)return 'alert';if(v>t)return 'watch';if(v<-2*t)return 'under';return 'ok';
}
function compute(){
  IT={};S.items.forEach(function(i){IT[i.id]=i});
  DATES=[];for(var d=S.meta.start;d<=S.meta.end;d=D.add(d,1))DATES.push(d);
  L={};var prev={};
  DATES.forEach(function(date){
    var ex=expectedFor(S.sales,S.dishes,date),ents=S.entries[date]||{},row={},next={};
    S.items.forEach(function(it){
      if(it.from>date)return;
      var e=ents[it.id]||{};
      var open=it.from===date?(it.open||0):(prev[it.id]==null?0:prev[it.id]);
      var p=e.p||0,c=e.c||0,w=e.w||0,close=round3(open+p-c-w);
      var k=e.k==null?null:e.k,gap=k==null?null:round3(close-k),eff=k==null?close:k;
      var exp=ex[it.id]||0,v=c-exp,vp=exp>0?v/exp:0;
      row[it.id]={open:open,p:p,c:c,w:w,close:close,k:k,gap:gap,eff:eff,exp:exp,v:v,vp:vp,st:statusOf(it,exp,c)};
      next[it.id]=eff;
    });
    L[date]=row;prev=next;
  });
}
function salesVal(date){var s=S.sales[date]||{},t=0;S.dishes.forEach(function(d){t+=(s[d.id]||0)*d.price});return t}
function portions(date){var s=S.sales[date]||{},t=0;S.dishes.forEach(function(d){t+=(s[d.id]||0)});return t}
function agg(d1,d2){
  var per={},days=[];
  DATES.forEach(function(date){
    if(date<d1||date>d2)return;
    var dy={date:date,act:0,std:0,waste:0,purch:0,close:0,sales:salesVal(date)};
    S.items.forEach(function(it){
      var r=L[date]&&L[date][it.id];if(!r)return;
      var a=per[it.id]||(per[it.id]={it:it,exp:0,c:0,w:0,p:0,short:0,flag:0,days:0,eff:0});
      a.exp+=r.exp;a.c+=r.c;a.w+=r.w;a.p+=r.p;a.short+=Math.max(0,r.gap||0);a.days++;
      if(r.st==='alert'||r.st==='watch')a.flag++;a.eff=r.eff;
      dy.act+=r.c*it.cost;dy.std+=r.exp*it.cost;dy.waste+=r.w*it.cost;dy.purch+=r.p*it.cost;dy.close+=r.eff*it.cost;
    });
    days.push(dy);
  });
  var list=Object.keys(per).map(function(k){return per[k]});
  var T={sales:0,act:0,std:0,waste:0,purch:0,excess:0,short:0,leak:0,close:days.length?days[days.length-1].close:0};
  list.forEach(function(a){
    var it=a.it,t=it.tol/100;
    a.var=a.c-a.exp;a.vp=a.exp>0?a.var/a.exp:0;
    a.excessV=Math.max(0,a.c-a.exp*(1+t))*it.cost;a.wasteV=a.w*it.cost;a.shortV=a.short*it.cost;
    a.leak=a.excessV+a.wasteV+a.shortV;a.actV=a.c*it.cost;a.stdV=a.exp*it.cost;
    a.verdict=a.exp<=0?(a.c>0?'watch':'none'):a.vp>2*t?'alert':a.vp>t?'watch':a.vp<-t?'under':'ok';
    T.excess+=a.excessV;T.short+=a.shortV;T.leak+=a.leak;
  });
  days.forEach(function(d){T.sales+=d.sales;T.act+=d.act;T.std+=d.std;T.waste+=d.waste;T.purch+=d.purch});
  return {list:list,days:days,T:T};
}

function trendChart(days){
  var W=680,H=232,pl=46,pr=14,pt=14,pb=28;
  var max=Math.max.apply(null,days.map(function(d){return Math.max(d.act,d.std)}))*1.12||1;
  var step=Math.pow(10,Math.floor(Math.log(max/4)/Math.LN10));var nice=[1,2,2.5,5,10].map(function(m){return m*step}).filter(function(s){return s>=max/5})[0]||step*10;
  var top=Math.ceil(max/nice)*nice;
  var x=function(i){return pl+(days.length>1?i*(W-pl-pr)/(days.length-1):(W-pl-pr)/2)},y=function(v){return pt+(H-pt-pb)*(1-v/top)};
  var g='';for(var t=0;t<=top+1e-6;t+=nice){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(y(t)+4)+'" text-anchor="end">'+(t>=1000?'₹'+Math.round(t/1000)+'k':'₹'+t)+'</text>'}
  var pa=days.map(function(d,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(d.act).toFixed(1)}).join(''),ps=days.map(function(d,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(d.std).toFixed(1)}).join('');
  var area=days.map(function(d,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(Math.max(d.act,d.std)).toFixed(1)}).join('')+days.slice().reverse().map(function(d,j){var i=days.length-1-j;return 'L'+x(i).toFixed(1)+' '+y(d.std).toFixed(1)}).join('')+'Z';
  var every=Math.ceil(days.length/7),xl='';days.forEach(function(d,i){if(i%every===0||i===days.length-1)xl+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+D.f(d.date)+'</text>'});
  var hits=days.map(function(d,i){var w=(W-pl-pr)/Math.max(1,days.length-1);return '<rect x="'+(x(i)-w/2)+'" y="'+pt+'" width="'+w+'" height="'+(H-pt-pb)+'" fill="transparent"><title>'+D.f(d.date)+' · Actual '+inr(d.act)+' · Standard '+inr(d.std)+' · Gap '+inr(d.act-d.std)+'</title></rect>'}).join('');
  var li=days.length-1;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Daily consumption value, actual against standard">'+g+
    '<path d="'+area+'" fill="var(--s2)" fill-opacity=".22" stroke="none"/>'+
    '<path d="'+ps+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>'+
    '<path d="'+pa+'" fill="none" stroke="var(--s1)" stroke-width="2.4" stroke-linejoin="round"/>'+
    '<circle cx="'+x(li)+'" cy="'+y(days[li].act)+'" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>'+
    '<circle cx="'+x(li)+'" cy="'+y(days[li].std)+'" r="4" fill="var(--muted)" stroke="var(--surface)" stroke-width="2"/>'+xl+hits+'</svg>';
}
function pairBars(rows,unit){
  var W=680,H=190,pl=44,pr=10,pt=10,pb=26;
  var max=Math.max.apply(null,rows.map(function(r){return Math.max(r.a,r.s)}))*1.12||1;
  var gw=(W-pl-pr)/rows.length,bw=Math.max(3,Math.min(14,gw/2.6));
  var y=function(v){return pt+(H-pt-pb)*(1-v/max)};

var CLS={star:['Star','var(--s3)','Keep the recipe and portion tight and feature it on the menu.'],plow:['Plowhorse','var(--s2)','Popular but low margin. Raise the price or trim recipe cost.'],puzzle:['Puzzle','var(--s1)','Good margin, low volume. Promote it with placement and staff suggestions.'],dog:['Dog','var(--muted)','Low volume and low margin. Rework the recipe or drop it.'],none:['No sales','var(--line)','']};

function econ(d1,d2){
  var A=agg(d1,d2),T=A.T,span=D.days(d1,d2)+1,mf=30/span,tfc=(S.meta.targetFC||30)/100;
  var fac={};A.list.forEach(function(a){fac[a.it.id]=a.stdV>0?(a.actV+a.wasteV+a.shortV)/a.stdV:1});
  var q={};DATES.forEach(function(d){if(d<d1||d>d2)return;var s=S.sales[d]||{};S.dishes.forEach(function(x){q[x.id]=(q[x.id]||0)+(s[x.id]||0)})});
  var rows=S.dishes.map(function(dh){
    var sc=0,ac=0;dh.recipe.forEach(function(r){var it=IT[r.item];if(!it)return;var c=r.qty*it.cost;sc+=c;ac+=c*(fac[r.item]==null?1:fac[r.item])});
    var n=q[dh.id]||0;
    return {d:dh,n:n,price:dh.price,sc:sc,ac:ac,rev:n*dh.price,fcS:dh.price?sc/dh.price:0,fcA:dh.price?ac/dh.price:0,actM:dh.price-ac,contrib:n*(dh.price-ac),lost:n*(ac-sc)};
  });
  var live=rows.filter(function(r){return r.n>0}),tn=0,trev=0,tac=0;
  live.forEach(function(r){tn+=r.n;trev+=r.rev;tac+=r.n*r.ac});
  var avgM=tn?(trev-tac)/tn:0,popT=live.length?0.7*tn/live.length:0;
  rows.forEach(function(r){if(r.n>0){var pop=r.n>=popT,hi=r.actM>=avgM;r.cls=pop&&hi?'star':pop?'plow':hi?'puzzle':'dog'}else r.cls='none'});
  var fixes=[],owner=(S.users.filter(function(u){return u.role==='owner'})[0]||S.users[0]||{}).id;
  A.list.forEach(function(a){
    var it=a.it,id=it.id;
    if(a.excessV*mf>=100)fixes.push({key:'use:'+id,type:'use',name:it.name,owner:it.owner,monthly:a.excessV*mf,evidence:'Used '+(a.vp>=0?'+':'−')+Math.abs(a.vp*100).toFixed(1)+'% against standard (tolerance '+it.tol+'%)',fix:'Issue to recipe. Weigh or measure at the pass, post portion standards, and have the manager sign off any issue above recipe.'});
    if(a.wasteV*mf>=100)fixes.push({key:'waste:'+id,type:'waste',name:it.name,owner:it.owner,monthly:a.wasteV*mf,evidence:'Logged wastage '+fq(a.w,it.unit)+' '+it.unit+(a.c?' ('+(a.w/a.c*100).toFixed(1)+'% of use)':''),fix:'Buy smaller lots more often, rotate stock first-in-first-out, and record a reason with every wastage entry.'});
    if(a.shortV*mf>=100)fixes.push({key:'count:'+id,type:'count',name:it.name,owner:it.owner,monthly:a.shortV*mf,evidence:'Physical count short by '+fq(a.short,it.unit)+' '+it.unit+' over '+a.days+' days',fix:'Restrict store access, issue only against signed requisitions, check receiving weights, and count daily until the gap closes.'});
  });
  rows.forEach(function(r){
    if(r.n>0&&r.fcA>tfc){
      var need=Math.ceil(r.ac/tfc/5)*5,cap=Math.ceil(r.price*.12/5)*5,inc=Math.min(need-r.price,cap);
      if(inc>0){var m2=r.n*mf*inc;if(m2>=100)fixes.push({key:'price:'+r.d.id,type:'price',name:r.d.name,owner:owner,monthly:m2,evidence:'Food cost '+pc(r.fcA,0)+' against a '+Math.round(tfc*100)+'% target at '+inr(r.price),fix:'Raise the price by '+inr(inc)+' to '+inr(r.price+inc)+' and review recipe cost for the rest of the gap.'});}
    }
  });
  fixes.sort(function(a,b){return b.monthly-a.monthly});
  var open=0;fixes.forEach(function(f){f.status=S.fixes[f.key]||'open';if(f.status!=='fixed')open+=f.monthly});
  return {A:A,T:T,span:span,mf:mf,tfc:tfc,rows:rows,fixes:fixes,open:open,avgM:avgM,popT:popT,d1:d1,d2:d2};
}
function waterfall(steps,total){
  var W=640,H=232,pl=60,pr=12,pt=26,pb=44,pts=[],cum=0;
  steps.forEach(function(s){pts.push({l:s.l,a:cum,b:cum+s.v,c:s.c,v:s.v});cum+=s.v});
  pts.push({l:total.l,a:0,b:cum,c:total.c,v:cum,total:true});
  var lo=Math.min(0,Math.min.apply(null,pts.map(function(p){return Math.min(p.a,p.b)}))),hi=Math.max(1,Math.max.apply(null,pts.map(function(p){return Math.max(p.a,p.b)})))*1.18;
  var y=function(v){return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo))};
  var st=Math.pow(10,Math.floor(Math.log((hi-lo)/4)/Math.LN10)),nice=[1,2,2.5,5,10].map(function(m){return m*st}).filter(function(s){return s>=(hi-lo)/5})[0]||st*10;
  var g='';for(var t=Math.ceil(lo/nice)*nice;t<=hi+1e-6;t+=nice)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--grid)"/><text x="'+(pl-8)+'" y="'+(y(t)+4)+'" text-anchor="end">'+inrS(t)+'</text>';
  var slot=(W-pl-pr)/pts.length,bw=Math.min(76,slot*.56),bars='';
  pts.forEach(function(p,i){
    var cx=pl+slot*i+slot/2,top=Math.min(y(p.a),y(p.b)),h=Math.max(2,Math.abs(y(p.a)-y(p.b)));
    bars+='<rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+p.c+'"'+(p.total?' fill-opacity=".85"':'')+'><title>'+p.l+' · '+inr(p.v)+'</title></rect>';
    bars+='<text class="mono" x="'+cx+'" y="'+(top-7)+'" text-anchor="middle" style="fill:var(--ink)">'+(p.total?'':(p.v>=0?'+':'−'))+inrS(Math.abs(p.v))+'</text>';
    bars+='<text x="'+cx+'" y="'+(H-22)+'" text-anchor="middle">'+p.l+'</text>';
    if(i<pts.length-1)bars+='<line x1="'+(cx+bw/2)+'" x2="'+(cx+slot-bw/2)+'" y1="'+y(p.b)+'" y2="'+y(p.b)+'" stroke="var(--muted)" stroke-dasharray="3 3"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Build-up of cost above standard">'+g+'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)"/>'+bars+'</svg>';
}

function wiCalc(E){

  E.rows.forEach(function(r){if(r.n>0&&r.fcA>tfc){var np=r.price*(1+w.p/100),nq=r.n*(1-w.v/100);dRev+=m*(nq*np-r.n*r.price);dCost+=m*(nq-r.n)*r.ac}});
  var s4=dRev-dCost,cost0=(T.act+T.waste+T.short)*m,rev0=T.sales*m,s5=(cost0-s1-s2-s3+dCost)*w.c/100;

  return {s:[s1,s2,s3,s4,s5],total:total,gm0:(rev0-cost0)/rev0,gm1:(rev1-cost1)/rev1,fc0:cost0/rev0,fc1:cost1/rev1};
}

function vEconomics(){

  var w=win(),A=agg(w.d1,w.d2),T=A.T,lbl=w.d1===w.d2?D.f(w.d2,true):D.f(w.d1)+' to '+D.f(w.d2);

  return '*'+S.meta.name+' · stock summary*\n'+lbl+'\n\nSales: '+inr(T.sales)+'\nFood cost: '+pc(T.sales?T.act/T.sales:0)+' (standard '+pc(T.sales?T.std/T.sales:0)+')\nPurchases: '+inr(T.purch)+'\nClosing stock: '+inr(T.close)+'\nLeakage: '+inr(T.leak)+' (above standard '+inr(T.excess)+', wastage '+inr(T.waste)+', count short '+inr(T.short)+')\n\nTop items to review:\n'+(top.map(function(a,i){return (i+1)+'. '+a.it.name+' · '+inr(a.leak)+' · '+(a.vp>=0?'+':'')+(a.vp*100).toFixed(0)+'% vs standard · '+userName(a.it.owner)}).join('\n')||'None');
}

/* ---------- events ---------- */
function clamp(d){return d<S.meta.start?S.meta.start:d>S.meta.end?S.meta.end:d}
function readNum(el){var v=el.value.trim();if(v==='')return null;var n=parseFloat(v);return isNaN(n)||n<0?undefined:n}
var app=document.getElementById('app');
if(app){
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,v=t.dataset.v,id=t.dataset.id;
  if(a==='ov'){if(e.target===t){ui.modal=null;renderModal()}return}
  if(t.tagName==='INPUT'){ if(a==='mine'){ui.mine=t.checked;renderView()} else if(a==='flag'){ui.flag=t.checked;renderView()} return}
  if(a==='pick'){ui.pick=id;renderAll();return}
  if(a==='nav')return go(v);
  if(a==='logout'){ui.user=null;ui.pick=null;try{sessionStorage.removeItem('bhandar.sess')}catch(x){}renderAll();return}
  if(a==='theme'){var cur=document.documentElement.getAttribute('data-theme');var dark=cur?cur==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;var nx=dark?'light':'dark';document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem('bhandar.theme',nx)}catch(x){}return}
  if(a==='range'){ui.range=+v;renderView();return}
  if(a==='cat'){ui.cat=v;renderView();return}
  if(a==='dprev'){ui.date=clamp(D.add(ui.date,-1));renderView();return}
  if(a==='dnext'){ui.date=clamp(D.add(ui.date,1));renderView();return}
  if(a==='nextday'){S.meta.end=D.add(S.meta.end,1);ui.date=S.meta.end;logA('Started '+D.f(S.meta.end,true));save();compute();renderView();toast('New day started. Opening stock carried forward.');return}
  if(a==='copyprev'){var pd=D.add(ui.date,-1);if(!S.sales[pd]){toast('No sales on the previous day');return}S.sales[ui.date]=Object.assign({},S.sales[pd]);logA(D.f(ui.date)+' · Sales copied from '+D.f(pd));save();compute();renderView();toast('Sales copied from '+D.f(pd));return}
  if(a==='erange'){ui.erange=+v;renderView();return}
  if(a==='copyfix'){copy(fixText(),'Fix plan copied');return}
  if(a==='detail'){ui.modal={type:'detail',id:id};renderModal();return}
  if(a==='closem'){ui.modal=null;renderModal();return}
  if(a==='summary'){copy(summaryText(),'Summary copied');return}
  if(a==='csvledger'){var rows=[['Date','Category','Item','Unit','Owner','Opening','Purchases','Consumed','Wastage','Closing','Physical count','Count gap','Standard use','Variance','Variance %','Status']];ledgerItems().forEach(function(it){var r=L[ui.date][it.id];rows.push([ui.date,it.cat,it.name,it.unit,userName(it.owner),r.open,r.p,r.c,r.w,r.close,r.k==null?'':r.k,r.gap==null?'':r.gap,round3(r.exp),round3(r.v),(r.vp*100).toFixed(1),r.st])});copy(csv(rows),'CSV copied');return}
  if(a==='csvvar'){var w=win(),A=agg(w.d1,w.d2),rows2=[['From','To','Category','Item','Owner','Standard','Actual','Variance %','Logged wastage Rs','Count short Rs','Excess use Rs','Leakage Rs','Verdict']];A.list.forEach(function(x){rows2.push([w.d1,w.d2,x.it.cat,x.it.name,userName(x.it.owner),round3(x.exp),round3(x.c),(x.vp*100).toFixed(1),Math.round(x.wasteV),Math.round(x.shortV),Math.round(x.excessV),Math.round(x.leak),x.verdict])});copy(csv(rows2),'CSV copied');return}
  if(a==='recipe'){var d=S.dishes.filter(function(x){return x.id===id})[0];ui.draft=JSON.parse(JSON.stringify(d));ui.modal={type:'recipe'};renderModal();return}
  if(a==='newdish'){ui.draft={id:null,name:'',cat:DISH_CATS[0],price:0,recipe:[]};ui.modal={type:'recipe'};renderModal();return}
  if(a==='rladd'){if(!S.items.length)return;ui.draft.recipe.push({item:S.items[0].id,qty:0});renderModal();return}
  if(a==='rlrm'){ui.draft.recipe.splice(+t.dataset.i,1);renderModal();return}
  if(a==='saverecipe'){var dr=ui.draft;dr.recipe=dr.recipe.filter(function(r){return r.qty>0});
    if(!dr.name.trim()||!(dr.price>0)||!dr.recipe.length){toast('Add a name, a price and at least one ingredient quantity');return}
    dr.name=dr.name.trim();
    if(dr.id){S.dishes=S.dishes.map(function(x){return x.id===dr.id?dr:x});logA('Recipe updated: '+dr.name)}else{dr.id='d'+Date.now().toString(36);S.dishes.push(dr);logA('Dish added: '+dr.name)}
    save();compute();ui.modal=null;renderModal();renderView();toast('Recipe saved');return}
  if(a==='newitem'){ui.draft={name:'',cat:'Vegetables',unit:'kg',cost:0,owner:ui.user.id,open:0,reorder:0,tol:8};ui.modal={type:'item'};renderModal();return}
  if(a==='saveitem'){var di=ui.draft,er=$('#ferr');
    if(!di.name.trim()||!(di.cost>0)){er.textContent='Enter a name and a cost above zero.';er.hidden=false;return}
    if(S.items.some(function(x){return x.name.toLowerCase()===di.name.trim().toLowerCase()})){er.textContent='An item with this name already exists.';er.hidden=false;return}
    var ni={id:'i'+Date.now().toString(36),name:di.name.trim(),cat:di.cat,unit:di.unit,cost:+di.cost,owner:di.owner,reorder:+di.reorder||0,tol:+di.tol||TOL[di.cat],open:+di.open||0,from:S.meta.end};
    S.items.push(ni);logA('Item added: '+ni.name);save();compute();ui.modal=null;renderModal();renderView();toast('Item added');return}
  if(a==='newuser'){ui.draft={name:'',role:'store',pin:''};ui.modal={type:'user'};renderModal();return}
  if(a==='saveuser'){var du=ui.draft,er2=$('#ferr');
    if(!du.name.trim()){er2.textContent='Enter a name.';er2.hidden=false;return}
    if(!/^\d{4}$/.test(du.pin)){er2.textContent='The PIN must be exactly 4 digits.';er2.hidden=false;return}
    S.users.push({id:'u'+Date.now().toString(36),name:du.name.trim(),role:du.role,pin:du.pin});logA('Person added: '+du.name.trim()+' ('+ROLES[du.role]+')');save();ui.modal=null;renderModal();renderView();toast('Person added');return}
  if(a==='rmuser'){var k='rm'+id;if(ui.confirm!==k){ui.confirm=k;renderView();setTimeout(function(){if(ui.confirm===k){ui.confirm=null;if(ui.view==='team')renderView()}},4000);return}
    var u=S.users.filter(function(x){return x.id===id})[0];if(u&&u.role==='owner'&&S.users.filter(function(x){return x.role==='owner'}).length<2){toast('Keep at least one owner');ui.confirm=null;renderView();return}
    S.users=S.users.filter(function(x){return x.id!==id});S.items.forEach(function(i){if(i.owner===id)i.owner=ui.user.id});logA('Person removed: '+(u?u.name:id));ui.confirm=null;save();renderView();return}
  if(a==='backup'){copy(JSON.stringify(S),'Backup copied');return}
  if(a==='sample'||a==='fresh'){
    if(ui.confirm!==a){ui.confirm=a;renderView();setTimeout(function(){if(ui.confirm===a){ui.confirm=null;if(ui.view==='team')renderView()}},4000);return}
    ui.confirm=null;
    if(a==='sample'){S=buildSample();ui.user=S.users[0]}
    else{var td=D.today();S={meta:{name:S.meta.name,start:td,end:td,sample:false,targetFC:S.meta.targetFC||30},users:S.users,items:[],dishes:[],sales:{},entries:{},audit:[],fixes:{}}}
    ui.date=S.meta.end;ui.view='overview';save();compute();renderAll();toast(a==='sample'?'Sample data loaded':'Started fresh. Add your items and dishes.');return}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dsel'){if(t.value)ui.date=clamp(t.value);renderView();return}
  var f=t.dataset.f;if(!f)return;
  if(f==='entry'){var val=readNum(t);if(val===undefined){t.value='';val=null}setEntry(ui.date,t.dataset.item,t.dataset.k,val);refreshRow(t.dataset.item);return}
  if(f==='sale'){var q=readNum(t);if(q===undefined){t.value='';q=null}var o=S.sales[ui.date]||(S.sales[ui.date]={}),old=o[t.dataset.dish];if(q==null)delete o[t.dataset.dish];else o[t.dataset.dish]=Math.round(q);
    var dn=S.dishes.filter(function(x){return x.id===t.dataset.dish})[0];if((old||0)!==(q||0))logA(D.f(ui.date)+' · Sales '+dn.name+': '+(old||0)+' → '+(q||0));save();compute();refreshSales();return}
  if(f==='item'){var it=IT[t.dataset.item],k=t.dataset.k,v=t.value;
    if(k==='name'){v=v.trim();if(!v){t.value=it.name;return}}else if(k!=='owner'){v=parseFloat(v);if(isNaN(v)||v<0){t.value=it[k];return}}
    if(it[k]!==v){logA('Item '+it.name+': '+k+' '+it[k]+' → '+v);it[k]=v;save();compute()}return}
  if(f==='fix'){var fk=t.dataset.key,fo=ECON&&ECON.fixes.filter(function(x){return x.key===fk})[0];S.fixes[fk]=t.value;logA('Fix plan: '+(fo?fo.name+' ('+TP[fo.type][0]+')':fk)+' set to '+t.value);save();renderView();return}
  if(f==='tfc'){var tv=parseFloat(t.value);if(!isNaN(tv)){S.meta.targetFC=Math.min(80,Math.max(5,tv));logA('Target food cost set to '+S.meta.targetFC+'%');save()}renderView();return}
  if(f==='esort'){ui.esort=t.value;renderView();return}
  if(f==='meta'){S.meta.name=t.value.trim()||S.meta.name;logA('Restaurant name changed');save();var rn=$$('.rn');rn.forEach(function(x){x.textContent=S.meta.name});return}
  if(f==='draft'){var dk=t.dataset.k,dv=t.value;if(['price','cost','open','reorder','tol'].indexOf(dk)>=0)dv=parseFloat(dv)||0;ui.draft[dk]=dv;
    if(ui.modal&&ui.modal.type==='recipe'&&dk==='price'){var s=$('#dsum');if(s){var c=dishCost(ui.draft);s.textContent='Standard cost '+inr(c)+' · food cost '+(ui.draft.price?pc(c/ui.draft.price,0):'—')}}
    if(ui.modal&&ui.modal.type==='item'&&dk==='cat'){ui.draft.tol=TOL[dv]||8;renderModal()}return}
  if(f==='rl'){var r=ui.draft.recipe[+t.dataset.i],rk=t.dataset.k;if(rk==='item'){r.item=t.value;renderModal()}else{r.qty=parseFloat(t.value)||0;var s2=$('#dsum');if(s2){var c2=dishCost(ui.draft);s2.textContent='Standard cost '+inr(c2)+' · food cost '+(ui.draft.price?pc(c2/ui.draft.price,0):'—')}}return}
});
app.addEventListener('input',function(e){
  if(e.target.dataset&&e.target.dataset.f==='wi'){var wk=e.target.dataset.k;ui.wi[wk]=parseFloat(e.target.value);var wo=$('#wo-'+wk);if(wo)wo.textContent=e.target.value+'%';updateWI();return}

  if(e.target.id==='pinf'){e.preventDefault();var u=S.users.filter(function(x){return x.id===ui.pick})[0],pin=$('#pin').value;
    if(u&&u.pin===pin){ui.user=u;ui.view='overview';try{sessionStorage.setItem('bhandar.sess',u.id)}catch(x){}renderAll()}else{var er=$('#perr');er.hidden=false;$('#pin').value='';$('#pin').focus()}}

app.addEventListener('keydown',function(e){
  var t=e.target;
